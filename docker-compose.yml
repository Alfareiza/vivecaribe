services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vivecaribe
    ports:
      - "5433:5432"
    volumes:
      - vivecaribe_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vivecaribe"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/vivecaribe
      APP_DATA_DIR: /data
    volumes:
      - ./apps/backend/booking_providers.yaml:/app/booking_providers.yaml:ro
      - vivecaribe_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  vivecaribe_pg:
  vivecaribe_data:
