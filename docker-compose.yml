services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      ACCOUNTS_YAML_PATH: /app/accounts.yaml
    volumes:
      - ./accounts.yaml:/app/accounts.yaml:ro
    restart: unless-stopped
