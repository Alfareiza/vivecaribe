[project]
name = "vivecaribe"
version = "0.1.0"
description = "ViveCaribe API — booking automation and business platform"
readme = "README.md"
authors = [
    { name = "Alfonso", email = "alfareiza@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "httpx>=0.28.1",
    "msal>=1.37.0",
    "phonenumbers>=9.0.36",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.4",
    "pycountry>=26.2.16",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sentry-sdk[fastapi]>=2.66.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "types-beautifulsoup4>=4.12.0.20250516",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--cov=vivecaribe",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
source = ["src/vivecaribe"]
branch = false
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
