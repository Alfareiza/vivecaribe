[project]
name = "vivecaribe"
version = "0.1.0"
description = "ViveCaribe API — booking automation and business platform"
readme = "README.md"
authors = [
    { name = "Alfonso", email = "alfareiza@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sentry-sdk[fastapi]>=2.66.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
