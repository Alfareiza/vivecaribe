# One entry per booking provider.
#
# Mailbox secrets are env-only. `credentials_vars` maps logical keys to env-var
# names (values are names, not secrets):
#   Gmail:
#     token: GYG_GMAIL_TOKEN
#     refresh_token: GYG_GMAIL_REFRESH_TOKEN
#   Outlook:
#     refresh_token: HOMEFANS_OUTLOOK_REFRESH_TOKEN
#   Zoho:
#     username: PROPIO_ZOHO_USERNAME
#     password: PROPIO_ZOHO_PASSWORD
#
# Shared OAuth app credentials live in Settings / env:
#   GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET
#   OUTLOOK_CLIENT_ID, OUTLOOK_CLIENT_SECRET
#
# Multiple providers may share the same credentials_vars when they share one
# inbox. `queries` is a named map — pipeline uses `new_bookings_query`.
# Zoho folder/time-window filters are ZohoMailbox class defaults (not YAML).

booking_providers:
  - booking_provider: getyourguide
    mailbox:
      mailbox_name: gmail
      credentials_vars:
        token: GYG_GMAIL_TOKEN
        refresh_token: GYG_GMAIL_REFRESH_TOKEN
      queries:
        new_bookings_query: 'from:do-not-reply@notification.getyourguide.com subject:(booking -"message about a booking" -"booking has been canceled" -"detail" -"first booking")'

  - booking_provider: viator
    mailbox:
      mailbox_name: gmail
      credentials_vars:
        token: VIATOR_GMAIL_TOKEN
        refresh_token: VIATOR_GMAIL_REFRESH_TOKEN
      queries:
        new_bookings_query: 'from:booking@t1.viator.com "Nueva reserva"'

  - booking_provider: homefans
    mailbox:
      mailbox_name: outlook
      credentials_vars:
        refresh_token: HOMEFANS_OUTLOOK_REFRESH_TOKEN
      queries:
        new_bookings_query: 'from:@homefans.net subject:new order'

  - booking_provider: propio
    mailbox:
      mailbox_name: zoho
      credentials_vars:
        username: PROPIO_ZOHO_USERNAME
        password: PROPIO_ZOHO_PASSWORD
      queries:
        new_bookings_query: "You've got a new order"
