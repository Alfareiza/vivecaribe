# One entry per booking provider. Locally, mailbox credentials are filenames
# under `secrets/` (never commit those files). On Vercel, paste the same JSON
# into an env var named from the file stem, e.g.:
#   vivecaribe_token.json        → VIVECARIBE_GMAIL_TOKEN_JSON
#   footballtourcol_token.json → FOOTBALLTOURCOL_GMAIL_TOKEN_JSON
# Multiple providers may share the same credentials_file / env var when they
# share one inbox. `queries` is a named map — pipeline uses `new_bookings_query`.

booking_providers:
  - booking_provider: getyourguide
    mailbox:
      mailbox_name: gmail
      credentials_file: vivecaribe_token.json
      queries:
        new_bookings_query: 'from:do-not-reply@notification.getyourguide.com subject:(booking -"message about a booking" -"booking has been canceled" -"detail" -"first booking")'

  - booking_provider: viator
    mailbox:
      mailbox_name: gmail
      credentials_file: footballtourcol_token.json
      queries:
        new_bookings_query: 'from:viator.com newer_than:7d'

  - booking_provider: homefans
    mailbox:
      mailbox_name: outlook
      credentials_file: homefans_outlook_token.txt
      queries:
        new_bookings_query: 'from:@homefans.net subject:new order'
