name: Migrate

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/migrations/**"
      - "apps/backend/alembic.ini"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    env:
      # Prod Supabase URL (async driver). Prefer session/direct host for DDL if
      # the transaction pooler ever flakes; pooler :6543 works for most upgrades.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Required by Settings; unused by Alembic itself.
      JWT_SECRET: ci-migrate-unused-placeholder-at-least-32b
      CRON_SECRET: ci-migrate-unused-placeholder
      ENVIRONMENT: prod
      SENTRY_DSN: ""

    steps:
      - uses: actions/checkout@v4

      - name: Require DATABASE_URL secret
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::error::Set repository secret DATABASE_URL (async SQLAlchemy URL for prod Supabase)."
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply migrations
        run: uv run alembic upgrade head
