name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vivecaribe_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vivecaribe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/vivecaribe_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/vivecaribe_test
      JWT_SECRET: test-jwt-secret-not-for-production-32b
      CRON_SECRET: test-cron-secret-not-for-production
      ENVIRONMENT: local
      SENTRY_DSN: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        run: uv run pytest
