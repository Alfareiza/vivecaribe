name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vivecaribe_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vivecaribe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/vivecaribe_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/vivecaribe_test
      JWT_SECRET: test-jwt-secret-not-for-production-32b
      CRON_SECRET: test-cron-secret-not-for-production
      ENVIRONMENT: local
      SENTRY_DSN: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - '.github/workflows/test.yml'

      - name: Setup Node
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: npm ci

      - name: Build
        if: steps.filter.outputs.frontend == 'true'
        run: npm run build