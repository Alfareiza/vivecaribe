# Non-secret mailbox accounts and search queries.
# Credentials (OAuth tokens, client secrets) live in environment variables, not here.

accounts:
  - name: example-gmail
    provider: gmail
    queries:
      - label: getyourguide
        query: 'from:getyourguide.com newer_than:7d'
      - label: viator
        query: 'from:viator.com newer_than:7d'

  - name: example-outlook
    provider: outlook
    queries:
      - label: homefans
        query: 'from:homefans.com'
